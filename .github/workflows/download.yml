name: Baixar vídeo
run-name: Baixar vídeo

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL HTTPS pública do vídeo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netdownloader-yt-dlp
  cancel-in-progress: false

jobs:
  download:
    runs-on: ${{ vars.YTDLP_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar yt-dlp e ffmpeg
        if: runner.environment == 'github-hosted'
        run: |
          python -m pip install --upgrade 'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==2.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Atualizar yt-dlp no runner próprio
        if: runner.environment == 'self-hosted'
        run: python -m pip install --upgrade 'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==2.0.0'
      - name: Iniciar provedor automático de PO Token
        run: |
          docker run --name bgutil-provider --detach --init \
            --publish 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.0
          if ! curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:4416/ping; then
            docker logs bgutil-provider
            exit 1
          fi
      - name: Baixar um vídeo
        env:
          VIDEO_URL: ${{ inputs.url }}
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
        run: python scripts/download.py
      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: downloads/
          if-no-files-found: error
          retention-days: 1
