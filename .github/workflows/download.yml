name: Baixar vídeo
run-name: Baixar vídeo

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL HTTPS pública do vídeo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netdownloader-yt-dlp
  cancel-in-progress: false

jobs:
  download:
    runs-on: ${{ vars.YTDLP_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar yt-dlp e ffmpeg
        if: runner.environment == 'github-hosted'
        run: |
          python -m pip install --upgrade 'yt-dlp[default]' 'yt-dlp-getpot-wpc==1.1.2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb
      - name: Atualizar yt-dlp no runner próprio
        if: runner.environment == 'self-hosted'
        run: python -m pip install --upgrade 'yt-dlp[default]' 'yt-dlp-getpot-wpc==1.1.2'
      - name: Preparar provedor de PO Token no runner público
        if: runner.environment == 'github-hosted'
        run: python scripts/prepare_wpc.py
      - name: Localizar navegador para o PO Token
        if: runner.environment == 'github-hosted'
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo "Chrome ou Chromium não foi encontrado no runner."
            exit 1
          fi
          echo "YTDLP_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Localizar navegador no runner próprio
        if: runner.environment == 'self-hosted'
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo "Chrome ou Chromium não foi encontrado no runner."
            exit 1
          fi
          echo "YTDLP_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Baixar um vídeo
        env:
          VIDEO_URL: ${{ inputs.url }}
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
        run: xvfb-run --auto-servernum python scripts/download.py
      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: downloads/
          if-no-files-found: error
          retention-days: 1
