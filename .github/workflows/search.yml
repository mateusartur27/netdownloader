name: Buscar no YouTube
run-name: Buscar no YouTube

on:
  workflow_dispatch:
    inputs:
      query:
        description: Termo de busca
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netdownloader-yt-dlp
  cancel-in-progress: false

jobs:
  search:
    runs-on: ${{ vars.YTDLP_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar yt-dlp
        run: python -m pip install --upgrade 'yt-dlp[default]'
      - name: Buscar vídeos
        env:
          SEARCH_QUERY: ${{ inputs.query }}
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
        run: python scripts/search_youtube.py
      - name: Disponibilizar resultados
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: search-results/results.json
          if-no-files-found: error
          retention-days: 1
